<Location /apache/backup-server>
    AuthType Basic
    AuthName "NovaNAS Backup Server"
    AuthUserFile /var/novanas/backup.htpasswd
    Require valid-user

    ProxyPass http://127.0.0.1:8000/
    ProxyPassReverse http://127.0.0.1:8000/
    RequestHeader set X-Forwarded-User "%{REMOTE_USER}s"
</Location>
